<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | YOVIRA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #F7F3EC;
      color: #252525;
      font-family: "Montserrat", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .wrapper {
      max-width: 700px;
    }

    .logo {
      font-family: "Montserrat", sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 7px;
      margin-bottom: 70px;
    }

    .number {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(100px, 25vw, 190px);
      line-height: 0.8;
      font-weight: 500;
      color: #C9B38A;
      margin-bottom: 35px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(42px, 8vw, 70px);
      font-weight: 500;
      margin-bottom: 18px;
    }

    p {
      max-width: 500px;
      margin: 0 auto 35px;
      color: #8A7A62;
      font-size: 14px;
      line-height: 1.8;
    }

    .button {
      display: inline-block;
      padding: 15px 30px;
      background: #252525;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: 0.3s ease;
    }

    .button:hover {
      background: #8A7A62;
    }

    .small {
      margin-top: 55px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8A7A62;
    }
  </style>
</head>

<body>

  <main class="wrapper">

    <div class="logo">YOVIRA</div>

    <div class="number">404</div>

    <h1>This page wandered off.</h1>

    <p>
      The page you're looking for doesn't exist or may have moved.
      Let's get you back to beautifully organized things.
    </p>

    <a href="index.html" class="button">
      Return Home
    </a>

    <div class="small">
      Plan beautifully. Live fully.
    </div>

  </main>

</body>
</html>
